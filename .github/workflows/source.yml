name: source

on:
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened]

jobs:
  validate-source:
    name: validate source branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: validate branch rules
        run: |
          head="${{ github.event.pull_request.head.ref }}"
          if [ "$head" != "staging" ]; then
            echo "::error::only 'staging' branch can be merged into 'production'"
            exit 1
          fi
          echo "::notice::valid source branch: $head → production"
