name: feed

on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]

jobs:
  validate-feed:
    name: validate source branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: validate branch rules
        run: |
          head="${{ github.event.pull_request.head.ref }}"
          if [ "$head" != "development" ]; then
            echo "::error::only 'development' branch can be merged into 'staging'"
            exit 1
          fi
          echo "::notice::valid source branch: $head → staging"
